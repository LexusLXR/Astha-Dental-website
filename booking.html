<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>booking-card</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .appointment {
            padding: 60px;
            background: linear-gradient(to right,
                    rgba(120, 180, 60, 0.7),
                    rgba(0, 150, 160, 0.8));
        }

        .appointment-card {
            background: white;
            padding: 40px;
            max-width: 800px;
            margin: auto;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }

        /* STEPS */
        .steps {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .step {
            flex: 1;
            font-size: 14px;
        }

        .step span {
            display: block;
            margin-bottom: 5px;
        }

        .bar {
            height: 6px;
            background: #ccc;
        }

        .active .bar {
            background: #8bb52b;
        }

        /* TITLE */
        .title {
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* FORM */
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #666;
        }

        select,
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
        }

        /* DATE + DAYS */
        .days {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .day {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #8bb52b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        /* TIME */
        .time-row {
            display: flex;
            gap: 20px;
        }

        /* LINE */
        .divider {
            height: 1px;
            background: #ddd;
            margin: 30px 0;
        }

        /* BUTTON */
        .next-btn {
            background: #8bb52b;
            color: white;
            border: none;
            padding: 12px 30px;
            float: right;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <section class="appointment">
        <div class="appointment-card">
            <!-- Steps -->
            <div class="steps">
                <div class="step active">
                    <span>1. Services</span>
                    <div class="bar"></div>
                </div>
                <div class="step">
                    <span>2. Time</span>
                    <div class="bar"></div>
                </div>
                <div class="step">
                    <span>3. Details</span>
                    <div class="bar"></div>
                </div>
                <div class="step">
                    <span>4. Payment</span>
                    <div class="bar"></div>
                </div>
                <div class="step">
                    <span>5. Done</span>
                    <div class="bar"></div>
                </div>
            </div>

            <p class="title">Please select service:</p>

            <!-- Selects -->
            <div class="form-row">
                <div class="form-group">
                    <label>Category</label>
                    <select>
                        <option>select category</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Services</label>
                    <select>
                        <option>select service</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Employee</label>
                    <select>
                        <option>Any</option>
                    </select>
                </div>
            </div>

            <!-- DATE -->
            <div class="form-row">
                <div class="form-group">
                    <label>I'm available on or after</label>
                    <input type="date">
                </div>

                <div class="form-group">
                    <label>Days</label>
                    <div class="days">
                        <div class="day">M</div>
                        <div class="day">T</div>
                        <div class="day">W</div>
                        <div class="day">T</div>
                        <div class="day">F</div>
                        <div class="day">S</div>
                        <div class="day">S</div>
                    </div>
                </div>
            </div>

            <!-- TIME -->
            <div class="time-row">
                <div class="form-group">
                    <label>Start from</label>
                    <input type="time" value="08:00">
                </div>

                <div class="form-group">
                    <label>Finish by</label>
                    <input type="time" value="18:00">
                </div>
            </div>

            <div class="divider"></div>

            <button class="next-btn">NEXT</button>

        </div>
    </section>
</body>

</html>
